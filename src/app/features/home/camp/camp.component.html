<section class="scene scene--camp">
  <img class="scene__bg" src="assets/img/scene-camp.webp" alt="A cozy adventurers' camp glowing with campfire light deep in the forest">
  <div class="scene__scrim"></div>

  <div class="scene__intro">
    <p class="eyebrow">A Warm Light in the Woods</p>
    <h2 class="scene__title">Join the Party</h2>
    <p class="scene__subtitle">You followed the firelight and found fellow travelers. Pull up a log and sign the guestbook — word of new pieces and rare finds travels fastest from here.</p>
  </div>

  <div class="camp-card">
    <app-join-party-form source="camp-scene" />
  </div>

  <app-hotspot [x]="12" [y]="88" icon="sign" label="Back to the Path" (activate)="go('hero')" />
</section>
