<section id="visit" class="cta">
  <div class="container cta__inner">
    <p class="eyebrow">Final Chapter</p>
    <h2 class="cta__title">The Troll Cave awaits</h2>
    <p class="cta__body">
      Every treasure you've seen here lives in our Etsy shop — Troll Cave —
      ready to ship straight from the workbench to your door.
    </p>
    <div class="cta__actions">
      <a class="btn-quest" [href]="etsyUrl" target="_blank" rel="noopener">Visit Troll Cave on Etsy →</a>
      <div class="cta__social">
        <a [href]="facebookUrl" target="_blank" rel="noopener">Facebook</a>
        <a [href]="pinterestUrl" target="_blank" rel="noopener">Pinterest</a>
      </div>
    </div>
  </div>
</section>
