<section class="scene scene--workbench">
  <img class="scene__bg" src="assets/img/scene-workbench.webp" alt="A troll's glass-crafting workbench nook" >
  <div class="scene__scrim"></div>

  <div class="scene__intro">
    <p class="eyebrow">Chapter Three</p>
    <h2 class="scene__title">The Maker's Tower</h2>
    <p class="scene__subtitle">Every commission is designed one-on-one to be truly one-of-a-kind. Click a piece below to learn its story.</p>
  </div>

  <div class="commission-row">
    @for (item of commissions; track item.id) {
      <button type="button" class="commission-card" (mouseenter)="onHover()" (click)="inspect(item)">
        <div class="commission-card__image-wrap">
          <img [src]="item.image" [alt]="item.name" class="commission-card__image">
          @if (item.badge) {
            <span class="commission-card__badge">{{ item.badge }}</span>
          }
        </div>
        <p class="commission-card__tagline">{{ item.tagline }}</p>
        <h3 class="commission-card__name">{{ item.name }}</h3>
      </button>
    }

    <div class="commission-card commission-card--coming-soon">
      <div class="commission-card__image-wrap commission-card__image-wrap--placeholder">
        <span class="commission-card__plus">+</span>
      </div>
      <p class="commission-card__tagline">Your story here</p>
      <h3 class="commission-card__name">More Commissions Coming Soon</h3>
    </div>
  </div>

  <app-hotspot [x]="8" [y]="92" icon="sign" label="Back to Friends of the Troll" (activate)="go('friends')" />
  <app-hotspot [x]="92" [y]="92" icon="exit" label="Continue to the Exit" (activate)="go('visit')" />

  <app-item-inspect [item]="selected" (closed)="closeInspect()" />
</section>
