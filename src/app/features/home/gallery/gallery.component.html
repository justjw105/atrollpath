<section class="scene scene--workbench">
  <img class="scene__bg" src="assets/img/scene-workbench.png" alt="A troll's glass-crafting workbench nook" >
  <div class="scene__scrim"></div>

  <div class="scene__intro">
    <p class="eyebrow">Chapter Two</p>
    <h2 class="scene__title">The Workbench</h2>
    <p class="scene__subtitle">Real studio shots, fresh from the kiln. Click any piece for a closer look.</p>
  </div>

  <div class="workbench-grid">
    @for (item of items; track item.id) {
      <button type="button" class="workbench-item" (mouseenter)="onHover()" (click)="inspect(item)">
        <img [src]="item.image" [alt]="item.caption" loading="lazy">
      </button>
    }
  </div>

  <app-hotspot [x]="8" [y]="92" icon="sign" label="Back to Treasure Room" (activate)="go('featured')" />
  <app-hotspot [x]="92" [y]="92" icon="exit" label="Continue to the Exit" (activate)="go('visit')" />

  <app-item-inspect [item]="selected" (closed)="closeInspect()" />
</section>
