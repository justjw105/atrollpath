<section class="scene scene--treasure">
  <img class="scene__bg" src="assets/img/scene-treasure-room.png" alt="A troll treasure room lined with glowing shelves" >
  <div class="scene__scrim"></div>

  <div class="scene__intro">
    <p class="eyebrow">Chapter One</p>
    <h2 class="scene__title">Treasure Room</h2>
    <p class="scene__subtitle">Click an artifact on the shelves to inspect it.</p>
  </div>

  <div class="artifact-row">
    @for (item of items; track item.id; let i = $index) {
      <button
        type="button"
        class="artifact"
        (mouseenter)="onHover()"
        (click)="inspect(item)"
      >
        <img [src]="item.image" [alt]="item.name" class="artifact__img">
        <img class="artifact__frame" src="assets/img/frame.png" alt="" aria-hidden="true">
        @if (item.badge) {
          <span class="artifact__badge">{{ item.badge }}</span>
        }
        <span class="artifact__name">{{ item.name }}</span>
      </button>
    }
  </div>

  <app-hotspot [x]="8" [y]="88" icon="door" label="Back to the Cave" (activate)="go('hero')" />
  <app-hotspot [x]="92" [y]="88" icon="sign" label="Continue to Workbench" (activate)="go('gallery')" />

  <app-item-inspect [item]="selected" (closed)="closeInspect()" />
</section>
