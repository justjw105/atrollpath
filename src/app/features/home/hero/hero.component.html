<section class="scene scene--hero">
  <img class="scene__bg" src="assets/img/hero-cave.png" alt="A cozy troll cave entrance in an enchanted mossy forest" >
  <div class="scene__scrim"></div>

  <div class="scene__intro">
    <p class="eyebrow">A quest begins at the Troll Cave</p>
    <h1 class="scene__title">Whimsical fused glass,<br>forged by firelight.</h1>
    <p class="scene__subtitle">Click a glowing waypoint below to explore, or open the map in the corner.</p>
  </div>

  <app-hotspot [x]="30" [y]="70" icon="door" label="Enter the Treasure Room" (activate)="go('featured')" />
  <app-hotspot [x]="62" [y]="58" icon="sign" label="Visit the Workbench" (activate)="go('gallery')" />
  <app-hotspot [x]="85" [y]="80" icon="chest" label="Troll Cave on Etsy" (activate)="go('visit')" />
</section>
