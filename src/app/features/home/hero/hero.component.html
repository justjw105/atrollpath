<section class="scene scene--hero" appEdgeScroll (scroll)="onScroll($event)">
  <div class="map-canvas" #canvas>
    <img class="scene__bg" src="assets/img/hero-map.png" alt="A fantasy map showing the troll's cave, a workshop tower, and a rocky cave entrance connected by a winding path" >

    @for (h of hotspots; track h.id) {
      <app-hotspot [x]="h.x" [y]="h.y" [icon]="h.icon" [label]="h.label" (activate)="go(h.target)" />
    }
  </div>

  <div class="scene__scrim"></div>

  @for (marker of offscreenMarkers(); track marker.id) {
    <app-edge-arrow [side]="marker.side" [y]="marker.y" [label]="marker.label" (activate)="go(marker.target)" />
  }

  <div class="scene__intro">
    <p class="eyebrow">A quest begins at the Troll Cave</p>
    <h1 class="scene__title">Whimsical fused glass,<br>forged by firelight.</h1>
    <p class="scene__subtitle">Click a landmark on the map to explore. Hover the edge of the screen to look further along the path.</p>
  </div>
</section>
