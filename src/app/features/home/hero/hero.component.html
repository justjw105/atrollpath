<section id="hero" class="hero">
  <img class="hero__bg" src="assets/img/hero-cave.png" alt="" aria-hidden="true">
  <div class="hero__scrim"></div>

  <div class="container hero__content">
    <p class="eyebrow">A quest begins at the Troll Cave</p>
    <h1 class="hero__title">Whimsical fused glass,<br>forged by firelight.</h1>
    <p class="hero__subtitle">
      Hand-cast dragon eggs, laser-etched gothic lanterns, and one-of-a-kind
      fused glass treasures — each piece carried out of the cave and into
      the light by ATrollPath.
    </p>
    <div class="hero__actions">
      <a class="btn-quest" [href]="etsyUrl" target="_blank" rel="noopener">
        Enter the Troll Cave →
      </a>
      <a class="hero__ghost-link" href="#featured">See the treasures</a>
    </div>
  </div>
</section>
