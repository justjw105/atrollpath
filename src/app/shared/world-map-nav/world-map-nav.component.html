<nav class="quest-map" aria-label="Site navigation, styled as a game world map">
  <div class="quest-map__frame">
    <img class="quest-map__bg" src="assets/img/nav-map.png" alt="" aria-hidden="true">

    <ul class="quest-map__path">
      @for (node of nodes; track node.id; let i = $index) {
        <li
          class="quest-map__node"
          [class.is-active]="activeId() === node.id"
          [style.left.%]="node.x"
          [style.top.%]="node.y"
        >
          <button type="button" class="quest-map__marker" (click)="travelTo(node.id)" [attr.aria-current]="activeId() === node.id ? 'true' : null">
            <span class="quest-map__torch"></span>
            <span class="quest-map__step">{{ i + 1 }}</span>
          </button>
          <span class="quest-map__label">{{ node.label }}</span>
        </li>
      }
    </ul>
  </div>
</nav>
