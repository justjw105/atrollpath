@if (scene.isMapOpen()) {
  <div class="map-overlay" role="dialog" aria-modal="true" aria-label="Quest map" (click)="scene.closeMap()">
    <div class="map-overlay__panel" (click)="$event.stopPropagation()">
      <div class="map-overlay__header">
        <p class="eyebrow">Quest Map</p>
        <button type="button" class="map-overlay__close" (click)="scene.closeMap()" aria-label="Close map">✕</button>
      </div>

      <div class="map-overlay__frame">
        <img class="map-overlay__bg" src="assets/img/nav-map.png" alt="" aria-hidden="true">

        <ul class="map-overlay__path">
          @for (node of nodes; track node.id; let i = $index) {
            <li
              class="map-node"
              [class.is-active]="scene.activeSceneId() === node.id"
              [style.left.%]="node.x"
              [style.top.%]="node.y"
            >
              <button
                type="button"
                class="map-node__marker"
                (mouseenter)="onHover()"
                (click)="travelTo(node.id)"
                [attr.aria-current]="scene.activeSceneId() === node.id ? 'true' : null"
              >
                <span class="map-node__torch"></span>
                <span class="map-node__step">{{ i + 1 }}</span>
              </button>
              <span class="map-node__label">{{ node.label }}</span>
            </li>
          }
        </ul>
      </div>

      <p class="map-overlay__hint">Click a waypoint to travel there instantly.</p>
    </div>
  </div>
}
