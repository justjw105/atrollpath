<button
  type="button"
  class="secret"
  [class.secret--ambient]="secret.variant === 'ambient'"
  [class.secret--lg]="secret.size === 'lg'"
  [class.secret--found]="found"
  [style.left.%]="secret.x"
  [style.top.%]="secret.y"
  (click)="reveal()"
  aria-label="Hmm, what's this?"
>
  <span class="secret__glow"></span>
  @if (secret.iconImage) {
    <img class="secret__icon secret__icon--image" [src]="secret.iconImage" alt="">
  } @else {
    <span class="secret__icon">{{ secret.icon }}</span>
  }
</button>
